name: Daily Study Reminder

on:
  schedule:
    # 每小时整点触发一次（UTC 时间）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      target_email:
        description: '接收测试提醒的账户邮箱'
        required: true
        type: string

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Reminder Script
        run: node scripts/daily-reminder.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}
          TARGET_EMAIL: ${{ inputs.target_email || '' }}
